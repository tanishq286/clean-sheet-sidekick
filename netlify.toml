# Netlify configuration for the Vite single-page app.
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every route serves index.html so client-side routes
# (/app, /app/edit, /u/:slug, …) don't 404 on refresh or deep-link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
